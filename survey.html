<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>附近生物图鉴 · 你是哪种城市物种？</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0e10;
    --surface: #18181c;
    --surface2: #222228;
    --border: #2e2e38;
    --accent: #e8c547;
    --accent2: #7ecfb3;
    --accent3: #e87c5a;
    --text: #e8e6e0;
    --text-dim: #8a8878;
    --text-muted: #555550;
    --guardian: #7ecfb3;
    --hermit: #9b8ec4;
    --nomad: #5aabde;
    --passerby: #e8c547;
    --butterfly: #e87c5a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grain texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.4;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ── COVER ── */
  #cover {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 24px;
    position: relative;
    overflow: hidden;
  }

  #cover::after {
    content: '';
    position: absolute;
    bottom: -120px;
    right: -100px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(232,197,71,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .cover-eyebrow {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 0.8s 0.2s forwards;
  }

  .cover-title {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(36px, 8vw, 64px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.8s 0.4s forwards;
  }

  .cover-title span {
    color: var(--accent);
    position: relative;
  }

  .cover-subtitle {
    font-size: 15px;
    color: var(--text-dim);
    max-width: 480px;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 0.8s 0.6s forwards;
  }

  .cover-meta {
    display: flex;
    gap: 32px;
    margin-bottom: 56px;
    opacity: 0;
    animation: fadeUp 0.8s 0.8s forwards;
  }

  .cover-meta-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .cover-meta-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .cover-meta-value {
    font-size: 20px;
    font-family: 'Noto Serif SC', serif;
    color: var(--text);
  }

  .btn-start {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--accent);
    color: #0e0e10;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 16px 36px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0;
    animation: fadeUp 0.8s 1s forwards;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .btn-start:hover {
    background: #f0d050;
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(232,197,71,0.2);
  }

  .btn-start svg { transition: transform 0.2s; }
  .btn-start:hover svg { transform: translateX(4px); }

  .cover-disclaimer {
    position: absolute;
    bottom: 32px;
    left: 24px;
    right: 24px;
    font-size: 11px;
    color: var(--text-muted);
    opacity: 0;
    animation: fadeIn 1s 1.5s forwards;
  }

  /* ── SURVEY ── */
  #survey { display: none; padding: 48px 0 80px; }

  .progress-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(14,14,16,0.95);
    backdrop-filter: blur(12px);
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .progress-bar {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Phase header */
  .phase-header {
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .phase-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .phase-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    color: var(--text);
  }

  /* Question */
  .question-block {
    margin-bottom: 48px;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.5s forwards;
  }

  .question-num {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    font-family: 'Noto Serif SC', serif;
  }

  .question-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 20px;
    line-height: 1.6;
    color: var(--text);
  }

  .question-hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
    font-style: italic;
  }

  /* Options */
  .options-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.18s;
    position: relative;
    overflow: hidden;
  }

  .option-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.18s;
  }

  .option-item:hover { border-color: var(--accent); }
  .option-item:hover::before { opacity: 0.04; }

  .option-item.selected {
    border-color: var(--accent);
    background: var(--surface2);
  }

  .option-item.selected::before { opacity: 0.08; }

  .option-key {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--text-muted);
    transition: all 0.18s;
    position: relative;
    z-index: 1;
    font-family: 'Noto Serif SC', serif;
    margin-top: 1px;
  }

  .option-item.selected .option-key {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232,197,71,0.1);
  }

  .option-text {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.6;
    position: relative;
    z-index: 1;
    transition: color 0.18s;
  }

  .option-item.selected .option-text { color: var(--text); }
  .option-item:hover .option-text { color: var(--text); }

  /* Rating table */
  .rating-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .rating-table th {
    padding: 10px 8px;
    color: var(--text-muted);
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }

  .rating-table td {
    padding: 12px 8px;
    border-bottom: 1px solid rgba(46,46,56,0.5);
    vertical-align: middle;
  }

  .rating-table tr:last-child td { border-bottom: none; }

  .rating-table .statement-cell {
    color: var(--text-dim);
    line-height: 1.5;
    padding-right: 16px;
  }

  .rating-cell {
    text-align: center;
    width: 48px;
  }

  .rating-radio {
    appearance: none;
    width: 18px;
    height: 18px;
    border: 1px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.18s;
    position: relative;
    display: block;
    margin: 0 auto;
  }

  .rating-radio:checked {
    border-color: var(--accent);
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(232,197,71,0.15);
  }

  .rating-radio:hover { border-color: var(--accent); }

  /* Open text */
  .open-textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    padding: 16px;
    resize: vertical;
    min-height: 100px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.7;
  }

  .open-textarea:focus { border-color: var(--accent); }
  .open-textarea::placeholder { color: var(--text-muted); }

  /* Navigation */
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid var(--border);
  }

  .btn-nav {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .btn-nav:hover { border-color: var(--text-dim); color: var(--text); }

  .btn-nav.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0e0e10;
    font-weight: 500;
  }

  .btn-nav.primary:hover {
    background: #f0d050;
    box-shadow: 0 4px 20px rgba(232,197,71,0.2);
  }

  .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── RESULT ── */
  #result {
    display: none;
    min-height: 100vh;
    padding: 80px 24px;
  }

  .result-eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
  }

  .result-type-badge {
    display: inline-block;
    padding: 6px 16px;
    font-size: 12px;
    letter-spacing: 0.1em;
    font-weight: 500;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.6s 0.4s forwards;
  }

  .result-title {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeUp 0.6s 0.5s forwards;
  }

  .result-subtitle {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 48px;
    font-family: 'Noto Serif SC', serif;
    opacity: 0;
    animation: fadeUp 0.6s 0.6s forwards;
  }

  .result-verdict {
    background: var(--surface);
    border-left: 3px solid;
    padding: 28px 32px;
    margin-bottom: 40px;
    font-size: 15px;
    line-height: 1.9;
    color: var(--text-dim);
    opacity: 0;
    animation: fadeUp 0.6s 0.7s forwards;
  }

  /* Score breakdown */
  .score-section {
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.6s 0.9s forwards;
  }

  .score-section-title {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .score-bars { display: flex; flex-direction: column; gap: 14px; }

  .score-bar-row {
    display: grid;
    grid-template-columns: 100px 1fr 36px;
    gap: 12px;
    align-items: center;
  }

  .score-bar-label { font-size: 13px; color: var(--text-dim); }

  .score-bar-track {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }

  .score-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    width: 0%;
  }

  .score-bar-pct { font-size: 12px; color: var(--text-muted); text-align: right; }

  /* Share */
  .share-section {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 32px;
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.6s 1.1s forwards;
  }

  .share-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    margin-bottom: 8px;
  }

  .share-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

  .share-buttons { display: flex; flex-wrap: wrap; gap: 10px; }

  .btn-share {
    padding: 10px 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-share:hover { border-color: var(--accent); color: var(--accent); }

  .btn-restart {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
    opacity: 0;
    animation: fadeUp 0.6s 1.2s forwards;
  }

  .btn-restart:hover { border-color: var(--text-dim); color: var(--text); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 24px;
    font-size: 13px;
    transition: transform 0.3s, opacity 0.3s;
    opacity: 0;
    z-index: 1000;
  }

  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Mobile */
  @media (max-width: 520px) {
    .rating-table th:nth-child(n+2), .rating-table td:nth-child(n+2) { width: 36px; }
    .rating-table th { font-size: 9px; padding: 8px 4px; }
    .rating-cell { width: 36px; }
    .score-bar-row { grid-template-columns: 80px 1fr 32px; }
    .cover-meta { gap: 20px; }
    .cover-meta-value { font-size: 17px; }
  }
</style>
</head>
<body>

<!-- ══════════ COVER ══════════ -->
<div id="cover">
  <div class="container">
    <div class="cover-eyebrow">项飙「附近」概念调研 · 2025</div>
    <h1 class="cover-title">你是哪种<br><span>附近生物</span>？</h1>
    <p class="cover-subtitle">MBTI已经过时了。现在测测你在钢筋水泥的森林里，究竟是什么样的都市物种——以及你和你的「附近」，还剩下多少连接。</p>
    <div class="cover-meta">
      <div class="cover-meta-item">
        <span class="cover-meta-label">题目数量</span>
        <span class="cover-meta-value">26题</span>
      </div>
      <div class="cover-meta-item">
        <span class="cover-meta-label">所需时间</span>
        <span class="cover-meta-value">约8分钟</span>
      </div>
      <div class="cover-meta-item">
        <span class="cover-meta-label">人格类型</span>
        <span class="cover-meta-value">5种</span>
      </div>
    </div>
    <button class="btn-start" onclick="startSurvey()">
      开始测试
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
  <div class="cover-disclaimer">本测试纯属娱乐，不含任何心理学诊断，别拿去相亲或面试。数据将用于学术研究，完全匿名。</div>
</div>

<!-- ══════════ SURVEY ══════════ -->
<div id="survey">
  <div class="progress-wrap">
    <div class="container">
      <div class="progress-info">
        <span id="phase-label">第一阶段</span>
        <span id="progress-text">0 / 26</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
  </div>
  <div class="container" id="questions-container"></div>
  <div class="container">
    <div class="nav-buttons">
      <button class="btn-nav" id="btn-prev" onclick="prevPage()" disabled>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M13 8H3M3 8L7 4M3 8L7 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        上一页
      </button>
      <button class="btn-nav primary" id="btn-next" onclick="nextPage()">
        下一页
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
          <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- ══════════ RESULT ══════════ -->
<div id="result">
  <div class="container">
    <div class="result-eyebrow">测试结果 · 附近生物图鉴</div>
    <div class="result-type-badge" id="result-badge"></div>
    <h2 class="result-title" id="result-title"></h2>
    <div class="result-subtitle" id="result-subtitle"></div>
    <div class="result-verdict" id="result-verdict"></div>
    <div class="score-section">
      <div class="score-section-title">你的五维成分</div>
      <div class="score-bars" id="score-bars"></div>
    </div>
    <div class="share-section">
      <div class="share-title">把你的物种分享给朋友</div>
      <div class="share-desc">让身边的人也来测测，看看你们是哪种附近生物</div>
      <div class="share-buttons">
        <button class="btn-share" onclick="copyLink()">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 10L10 6M8.5 3.5L10 2a3.5 3.5 0 015 5l-1.5 1.5M7.5 12.5L6 14a3.5 3.5 0 01-5-5l1.5-1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          复制链接
        </button>
        <button class="btn-share" onclick="copyResult()">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="9" height="9" rx="1" stroke="currentColor" stroke-width="1.5"/><path d="M3 11V3a1 1 0 011-1h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          复制结果文字
        </button>
      </div>
    </div>
    <button class="btn-restart" onclick="restart()">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 8a6 6 0 1012 0A6 6 0 002 8zM8 5v3l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      重新测试
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
// DATA: Questions & Scoring Logic
// ══════════════════════════════════════════════

// Personality types: guardian, hermit, nomad, passerby, butterfly

const personalities = {
  guardian: {
    name: '附近的守望者',
    en: 'The Guardian',

          { key: 'A', text: '非常想，已经迫不及待了', scores: { guardian: 3, butterfly: 1 } },
          { key: 'B', text: '比较想，愿意试一试', scores: { guardian: 2 } },
          { key: 'C', text: '不确定，看心情', scores: { passerby: 1 } },
          { key: 'D', text: '不太想，没那闲工夫', scores: { hermit: 1, nomad: 1 } },
          { key: 'E', text: '完全不想，别来沾边', scores: { hermit: 3 } }
        ]
      },
      {
        id: 'q26',
        type: 'open',
        text: '【开放题·选填】关于"家附近变陌生"，你有没有哪个瞬间感触很深？或者你理想中有温度的社区是啥样的？',
        hint: '这一题不影响结果，但欢迎分享你的故事 ✦'
      }
    ]
  }
];

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
let currentPage = 0;
let answers = {};
let isTerminated = false;

// ══════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════
function startSurvey() {
  document.getElementById('cover').style.display = 'none';
  document.getElementById('survey').style.display = 'block';
  window.scrollTo(0, 0);
  renderPage(0);
}

function renderPage(pageIdx) {
  const page = pages[pageIdx];
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  // Phase header
  const phaseDiv = document.createElement('div');
  phaseDiv.className = 'phase-header';
  phaseDiv.innerHTML = `<div class="phase-label">${page.phase}</div><div class="phase-title">${page.phaseTitle}</div>`;
  container.appendChild(phaseDiv);

  // Questions
  page.questions.forEach((q, qi) => {
    const block = document.createElement('div');
    block.className = 'question-block';
    block.style.animationDelay = `${qi * 0.08}s`;

    const qNumGlobal = getGlobalQuestionNumber(pageIdx, qi);

    let inner = `<div class="question-num">Q${qNumGlobal}</div><div class="question-text">${q.text}</div>`;
    if (q.hint) inner += `<div class="question-hint">${q.hint}</div>`;

    if (q.type === 'single') {
      inner += `<div class="options-list">`;
      q.options.forEach(opt => {
        const sel = answers[q.id] === opt.key ? ' selected' : '';
        inner += `<div class="option-item${sel}" onclick="selectSingle('${q.id}','${opt.key}',this)">
          <div class="option-key">${opt.key}</div>
          <div class="option-text">${opt.text}</div>
        </div>`;
      });
      inner += `</div>`;
    } else if (q.type === 'multi') {
      inner += `<div class="options-list">`;
      q.options.forEach(opt => {
        const sel = (answers[q.id] || []).includes(opt.key) ? ' selected' : '';
        inner += `<div class="option-item${sel}" onclick="selectMulti('${q.id}','${opt.key}',this)">
          <div class="option-key">${opt.key}</div>
          <div class="option-text">${opt.text}</div>
        </div>`;
      });
      inner += `</div>`;
    } else if (q.type === 'rating') {
      inner += `<table class="rating-table">
        <thead>
          <tr>
            <th style="text-align:left">说法</th>
            <th>1分</th><th>2分</th><th>3分</th><th>4分</th><th>5分</th>
          </tr>
        </thead>
        <tbody>`;
      q.statements.forEach(s => {
        inner += `<tr>
          <td class="statement-cell">${s.text}</td>`;
        for (let v = 1; v <= 5; v++) {
          const chk = (answers[s.id] == v) ? ' checked' : '';
          inner += `<td class="rating-cell">
            <input type="radio" class="rating-radio" name="${s.id}" value="${v}"${chk} onchange="selectRating('${s.id}',${v},'${s.dim}')">
          </td>`;
        }
        inner += `</tr>`;
      });
      inner += `</tbody></table>`;
    } else if (q.type === 'open') {
      const val = answers[q.id] || '';
      inner += `<textarea class="open-textarea" placeholder="写点什么吧..." rows="4" oninput="answers['${q.id}']=this.value">${val}</textarea>`;
    }

    block.innerHTML = inner;
    container.appendChild(block);
  });

  // Progress
  updateProgress();
  document.getElementById('btn-prev').disabled = pageIdx === 0;
  document.getElementById('btn-next').textContent = pageIdx === pages.length - 1 ? '查看结果 →' : '下一页';
  document.getElementById('btn-next').innerHTML = pageIdx === pages.length - 1
    ? '查看结果 <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    : '下一页 <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function getGlobalQuestionNumber(pageIdx, qIdx) {
  let n = 0;
  for (let i = 0; i < pageIdx; i++) n += pages[i].questions.length;
  return n + qIdx + 1;
}

function updateProgress() {
  const totalQ = pages.reduce((a, p) => a + p.questions.length, 0);
  const answered = Object.keys(answers).length;
  const pct = (currentPage / (pages.length - 1)) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${answered} / ${totalQ} 已作答`;
  document.getElementById('phase-label').textContent = pages[currentPage].phase;
}

// ══════════════════════════════════════════════
// INTERACTIONS
// ══════════════════════════════════════════════
function selectSingle(qid, key, el) {
  answers[qid] = key;
  const parent = el.closest('.options-list');
  parent.querySelectorAll('.option-item').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  updateProgress();

  // Check terminal
  const page = pages[currentPage];
  const q = page.questions.find(x => x.id === qid);
  const opt = q.options.find(o => o.key === key);
  if (opt && opt.terminal) {
    setTimeout(() => {
      isTerminated = true;
      computeAndShowResult();
    }, 400);
  }
}

function selectMulti(qid, key, el) {
  if (!answers[qid]) answers[qid] = [];
  const idx = answers[qid].indexOf(key);
  if (idx === -1) {
    answers[qid].push(key);
    el.classList.add('selected');
  } else {
    answers[qid].splice(idx, 1);
    el.classList.remove('selected');
  }
  updateProgress();
}

function selectRating(sid, val, dim) {
  answers[sid] = val;
  updateProgress();
}

// ══════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════
function nextPage() {
  if (currentPage < pages.length - 1) {
    currentPage++;
    renderPage(currentPage);
  } else {
    computeAndShowResult();
  }
}

function prevPage() {
  if (currentPage > 0) {
    currentPage--;
    renderPage(currentPage);
  }
}

// ══════════════════════════════════════════════
// SCORING ENGINE
// ══════════════════════════════════════════════
function computeAndShowResult() {
  const scores = { guardian: 0, hermit: 0, nomad: 0, passerby: 0, butterfly: 0 };

  // Process all pages
  pages.forEach(page => {
    page.questions.forEach(q => {
      if (q.type === 'single') {
        const key = answers[q.id];
        if (key) {
          const opt = q.options.find(o => o.key === key);
          if (opt && opt.scores) addScores(scores, opt.scores);
        }
      } else if (q.type === 'multi') {
        const keys = answers[q.id] || [];
        keys.forEach(key => {
          const opt = q.options.find(o => o.key === key);
          if (opt && opt.scores) addScores(scores, opt.scores);
        });
      } else if (q.type === 'rating') {
        q.statements.forEach(s => {
          const val = parseInt(answers[s.id]) || 0;
          if (val >= 1) {
            // Map rating to score: 5→+3, 4→+2, 3→+1, 2→0, 1→-1
            const mapped = [0, -1, 0, 1, 2, 3][val];
            if (mapped > 0) scores[s.dim] += mapped;
            else if (mapped < 0) {
              // Negative for that dimension means others get slight boost
              const others = Object.keys(scores).filter(k => k !== s.dim);
              others.forEach(k => scores[k] += 0.3);
            }
          }
        });
      }
    });
  });

  // If terminated early (q1 or q2), distribute small baseline
  if (isTerminated) {
    scores.hermit += 1;
    scores.nomad += 1;
  }

  // Find winner
  const winner = Object.entries(scores).sort((a, b) => b[1] - a[1])[0][0];
  showResult(winner, scores);
  submitToBackend(answers, winner, scores);
}

function addScores(target, src) {
  Object.entries(src).forEach(([k, v]) => { target[k] = (target[k] || 0) + v; });
}

// ══════════════════════════════════════════════
// RESULT DISPLAY
// ══════════════════════════════════════════════
function showResult(winner, scores) {
  document.getElementById('survey').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  window.scrollTo(0, 0);

  const p = personalities[winner];
  const color = p.color;

  document.getElementById('result-badge').textContent = p.badge;
  document.getElementById('result-badge').style.cssText = `background: ${color}22; color: ${color}; border: 1px solid ${color}44;`;

  document.getElementById('result-title').textContent = p.name;
  document.getElementById('result-title').style.color = color;

  document.getElementById('result-subtitle').textContent = `${p.en}`;

  document.getElementById('result-verdict').textContent = p.verdict;
  document.getElementById('result-verdict').style.borderColor = color;

  // Score bars
  const total = Math.max(Object.values(scores).reduce((a, b) => a + b, 0), 1);
  const labels = { guardian: '守望者', hermit: '独行侠', nomad: '游牧人', passerby: '路人甲', butterfly: '社交花' };
  const colors2 = { guardian: 'var(--guardian)', hermit: 'var(--hermit)', nomad: 'var(--nomad)', passerby: 'var(--passerby)', butterfly: 'var(--butterfly)' };

  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  const barsEl = document.getElementById('score-bars');
  barsEl.innerHTML = sorted.map(([k, v]) => {
    const pct = Math.round((v / total) * 100);
    return `<div class="score-bar-row">
      <div class="score-bar-label">${labels[k]}</div>
      <div class="score-bar-track">
        <div class="score-bar-fill" style="background:${colors2[k]};width:0%" data-pct="${pct}"></div>
      </div>
      <div class="score-bar-pct">${pct}%</div>
    </div>`;
  }).join('');

  // Animate bars
  setTimeout(() => {
    barsEl.querySelectorAll('.score-bar-fill').forEach(bar => {
      bar.style.width = bar.dataset.pct + '%';
    });
  }, 300);

  // Store result for sharing
  window._resultData = { winner, p, scores };
}

// ══════════════════════════════════════════════
// SHARING
// ══════════════════════════════════════════════
function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => showToast('链接已复制 ✓'));
}

function copyResult() {
  const { winner, p } = window._resultData;
  const text = `「附近生物图鉴」\n我是：${p.name} ${p.en}\n${p.badge}\n\n${p.verdict.substring(0, 60)}……\n\n测测你是哪种附近生物：${window.location.href}`;
  navigator.clipboard.writeText(text).then(() => showToast('结果文字已复制 ✓'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function restart() {
  answers = {};
  currentPage = 0;
  isTerminated = false;
  document.getElementById('result').style.display = 'none';
  document.getElementById('cover').style.display = 'flex';
  window.scrollTo(0, 0);
}

// ══════════════════════════════════════════════
// BACKEND SUBMISSION
// Stores data in localStorage for demo; in production
// replace this with a real API endpoint.
// ══════════════════════════════════════════════
function submitToBackend(ans, winner, scores) {
  try {
    const record = {
      ts: Date.now(),
      winner,
      scores,
      answers: ans,
      ua: navigator.userAgent
    };
    const existing = JSON.parse(localStorage.getItem('survey_results') || '[]');
    existing.push(record);
    localStorage.setItem('survey_results', JSON.stringify(existing));
  } catch(e) {}
}
</script>
