 <!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>附近生物图鉴 · 你是哪种城市物种？</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0e10;
    --surface: #1a1a20;
    --surface2: #24242e;
    --border: #353545;
    --accent: #e8c547;
    --accent2: #7ecfb3;
    --accent3: #e87c5a;
    --text: #ffffff;
    --text-dim: #b0b0b0;
    --text-muted: #707070;
    --looker: #7ecfb3;
    --laoma: #f0a050;
    --hughost: #9b8ec4;
    --oenbye: #888899;
    --wifier: #5aabde;
    --bystander: #b0a870;
    --apiao: #c0c0c8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    font-weight: 300;
    line-height: 1.7;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 999;
    opacity: 0.4;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ── COVER ── */
  #cover {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 24px;
    position: relative;
    overflow: hidden;
  }

  #cover::after {
    content: '';
    position: absolute;
    bottom: -120px;
    right: -100px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(232,197,71,0.07) 0%, transparent 70%);
    pointer-events: none;
  }

  .cover-eyebrow {
    font-size: 11px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 28px;
    opacity: 0;
    animation: fadeUp 0.8s 0.2s forwards;
  }

  .cover-title {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(36px, 8vw, 64px);
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.01em;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 0.8s 0.4s forwards;
  }

  .cover-title span {
    color: var(--accent);
    position: relative;
  }

  .cover-subtitle {
    font-size: 15px;
    color: var(--text-dim);
    max-width: 480px;
    margin-bottom: 48px;
    opacity: 0;
    animation: fadeUp 0.8s 0.6s forwards;
  }

  .cover-meta {
    display: flex;
    gap: 32px;
    margin-bottom: 56px;
    opacity: 0;
    animation: fadeUp 0.8s 0.8s forwards;
  }

  .cover-meta-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .cover-meta-label {
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .cover-meta-value {
    font-size: 20px;
    font-family: 'Noto Serif SC', serif;
    color: var(--text);
  }

  .btn-start {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--accent);
    color: #0e0e10;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.05em;
    padding: 16px 36px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0;
    animation: fadeUp 0.8s 1s forwards;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .btn-start:hover {
    background: #f0d050;
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(232,197,71,0.2);
  }

  .btn-start svg { transition: transform 0.2s; }
  .btn-start:hover svg { transform: translateX(4px); }

  .cover-disclaimer {
    position: absolute;
    bottom: 32px;
    left: 24px;
    right: 24px;
    font-size: 11px;
    color: var(--text-muted);
    opacity: 0;
    animation: fadeIn 1s 1.5s forwards;
  }

  /* ── COVER PIXEL ART ── */
  .cover-deco {
    position: absolute; inset: 0;
    pointer-events: none; overflow: hidden;
  }

  /* Grid lines */
  .cover-grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(232,197,71,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,197,71,0.02) 1px, transparent 1px);
    background-size: 40px 40px;
  }

  /* Stars */
  @keyframes starTwinkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }
  @keyframes starFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  .cover-star {
    position: absolute;
    width: 2px; height: 2px;
    background: var(--accent);
    animation: starTwinkle var(--dur,3s) ease-in-out infinite,
               starFloat var(--float-dur,5s) ease-in-out infinite;
    animation-delay: var(--delay,0s);
  }

  /* Moon */
  .cover-moon {
    position: absolute;
    top: 10%; right: 15%;
    width: 48px; height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #f5e6b8, #e8c547);
    box-shadow: 0 0 60px rgba(232,197,71,0.15), 0 0 120px rgba(232,197,71,0.05);
    animation: moonGlow 4s ease-in-out infinite;
  }
  @keyframes moonGlow {
    0%, 100% { box-shadow: 0 0 60px rgba(232,197,71,0.15), 0 0 120px rgba(232,197,71,0.05); }
    50% { box-shadow: 0 0 80px rgba(232,197,71,0.2), 0 0 150px rgba(232,197,71,0.08); }
  }

  /* Skyline */
  .cover-skyline {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 160px;
  }
  .cover-building {
    position: absolute; bottom: 0;
    width: var(--w); height: var(--h);
    background: #14141c;
    border: 1px solid #252535;
    border-bottom: none;
  }
  .cover-window {
    position: absolute;
    width: 6px; height: 4px;
    background: var(--accent);
    opacity: var(--op,0.6);
    animation: windowFlick var(--fd,3s) ease-in-out infinite;
    animation-delay: var(--fdel,0s);
  }
  @keyframes windowFlick {
    0%, 100% { opacity: var(--op,0.6); }
    50% { opacity: 0.2; }
  }

  /* Ground */
  .cover-ground {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 8px;
    background: #1a1a28;
    border-top: 1px solid #2a2a3a;
  }

  /* Street lamp */
  .cover-lamp {
    position: absolute;
    bottom: 8px;
    width: 2px; height: 60px;
    background: #2a2a3a;
  }
  .cover-lamp::after {
    content: '';
    position: absolute;
    top: 0; left: -6px;
    width: 14px; height: 6px;
    background: var(--accent);
    opacity: 0.7;
    box-shadow: 0 0 20px var(--accent), 0 0 40px rgba(232,197,71,0.2);
    animation: lampGlow 2s ease-in-out infinite;
  }
  @keyframes lampGlow {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }

  /* Walker */
  @keyframes walkCycle {
    0%, 100% { transform: translateX(-30px); }
    50% { transform: translateX(30px); }
  }
  .cover-walker {
    position: absolute;
    bottom: 12px;
    animation: walkCycle 12s ease-in-out infinite;
  }

  /* Coffee sign */
  @keyframes coffeeBlink {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
  .cover-cafe-sign {
    position: absolute;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--accent);
    opacity: 0.6;
    animation: coffeeBlink 3s ease-in-out infinite;
  }

  .cover-deco { animation: fadeIn 3s ease-out; }

  /* ── SURVEY ── */
  #survey { display: none; padding: 48px 0 80px; }

  .progress-wrap {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(14,14,16,0.95);
    backdrop-filter: blur(12px);
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
  }

  .progress-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .progress-bar {
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .phase-header {
    margin-bottom: 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .phase-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .phase-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 22px;
    color: var(--text);
  }

  .question-block {
    margin-bottom: 48px;
    opacity: 0;
    transform: translateY(16px);
    animation: fadeUp 0.5s forwards;
  }

  .question-num {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 0.1em;
    margin-bottom: 10px;
    font-family: 'Noto Serif SC', serif;
  }

  .question-text {
    font-family: 'Noto Serif SC', serif;
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 20px;
    line-height: 1.6;
    color: var(--text);
  }

  .question-hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 16px;
    font-style: italic;
  }

  .options-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .option-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.18s;
    position: relative;
    overflow: hidden;
  }

  .option-item::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--accent);
    opacity: 0;
    transition: opacity 0.18s;
  }

  .option-item:hover { border-color: var(--accent); }
  .option-item:hover::before { opacity: 0.04; }

  .option-item.selected {
    border-color: var(--accent);
    background: var(--surface2);
  }

  .option-item.selected::before { opacity: 0.08; }

  .option-key {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--text-dim);
    transition: all 0.18s;
    position: relative;
    z-index: 1;
    font-family: 'Noto Serif SC', serif;
    margin-top: 1px;
  }

  .option-item.selected .option-key {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232,197,71,0.1);
  }

  .option-text {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.6;
    position: relative;
    z-index: 1;
    transition: color 0.18s;
  }

  .option-item.selected .option-text { color: var(--text); }
  .option-item:hover .option-text { color: var(--text); }

  .rating-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .rating-table th {
    padding: 10px 8px;
    color: var(--text-dim);
    font-weight: 400;
    font-size: 11px;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }

  .rating-table td {
    padding: 12px 8px;
    border-bottom: 1px solid rgba(53,53,69,0.5);
    vertical-align: middle;
  }

  .rating-table tr:last-child td { border-bottom: none; }

  .rating-table .statement-cell {
    color: var(--text-dim);
    line-height: 1.5;
    padding-right: 16px;
  }

  .rating-cell {
    text-align: center;
    width: 48px;
  }

  .rating-radio {
    appearance: none;
    width: 18px;
    height: 18px;
    border: 1px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.18s;
    position: relative;
    display: block;
    margin: 0 auto;
  }

  .rating-radio:checked {
    border-color: var(--accent);
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(232,197,71,0.15);
  }

  .rating-radio:hover { border-color: var(--accent); }

  .open-textarea {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 14px;
    padding: 16px;
    resize: vertical;
    min-height: 100px;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1.7;
  }

  .open-textarea:focus { border-color: var(--accent); }
  .open-textarea::placeholder { color: var(--text-muted); }

  .nav-buttons {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 48px;
    padding-top: 32px;
    border-top: 1px solid var(--border);
  }

  .btn-nav {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 28px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
  }

  .btn-nav:hover { border-color: var(--text-dim); color: var(--text); }

  .btn-nav.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #0e0e10;
    font-weight: 500;
  }

  .btn-nav.primary:hover {
    background: #f0d050;
    box-shadow: 0 4px 20px rgba(232,197,71,0.2);
  }

  .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── RESULT ── */
  #result {
    display: none;
    min-height: 100vh;
    padding: 80px 24px;
  }

  .result-eyebrow {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
  }

  .result-type-badge {
    display: inline-block;
    padding: 6px 16px;
    font-size: 12px;
    letter-spacing: 0.1em;
    font-weight: 500;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.6s 0.4s forwards;
  }

  .result-title {
    font-family: 'Noto Serif SC', serif;
    font-size: clamp(28px, 6vw, 48px);
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 8px;
    opacity: 0;
    animation: fadeUp 0.6s 0.5s forwards;
  }

  .result-subtitle {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 32px;
    font-family: 'Noto Serif SC', serif;
    opacity: 0;
    animation: fadeUp 0.6s 0.6s forwards;
  }

  .result-image {
    width: 100%;
    max-width: 320px;
    margin: 0 auto 32px;
    border-radius: 2px;
    border: 1px solid var(--border);
    display: block;
    opacity: 0;
    animation: fadeUp 0.6s 0.65s forwards;
  }

  .result-verdict {
    background: var(--surface);
    border-left: 3px solid;
    padding: 28px 32px;
    margin-bottom: 40px;
    font-size: 15px;
    line-height: 1.9;
    color: var(--text-dim);
    opacity: 0;
    animation: fadeUp 0.6s 0.7s forwards;
  }

  .score-section {
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.6s 0.9s forwards;
  }

  .score-section-title {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 20px;
  }

  .score-bars { display: flex; flex-direction: column; gap: 14px; }

  .score-bar-row {
    display: grid;
    grid-template-columns: 90px 1fr 36px;
    gap: 12px;
    align-items: center;
  }

  .score-bar-label { font-size: 12px; color: var(--text-dim); }

  .score-bar-track {
    height: 6px;
    background: var(--surface2);
    border-radius: 3px;
    overflow: hidden;
  }

  .score-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    width: 0%;
  }

  .score-bar-pct { font-size: 12px; color: var(--text-muted); text-align: right; }

  .share-section {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 32px;
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 0.6s 1.1s forwards;
  }

  .share-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    margin-bottom: 8px;
  }

  .share-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

  .share-buttons { display: flex; flex-wrap: wrap; gap: 10px; }

  .btn-share {
    padding: 10px 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-share:hover { border-color: var(--accent); color: var(--accent); }

  .btn-restart {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans SC', sans-serif;
    opacity: 0;
    animation: fadeUp 0.6s 1.2s forwards;
  }

  .btn-restart:hover { border-color: var(--text-dim); color: var(--text); }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 24px;
    font-size: 13px;
    transition: transform 0.3s, opacity 0.3s;
    opacity: 0;
    z-index: 1000;
  }

  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  @media (max-width: 520px) {
    .rating-table th:nth-child(n+2), .rating-table td:nth-child(n+2) { width: 36px; }
    .rating-table th { font-size: 9px; padding: 8px 4px; }
    .rating-cell { width: 36px; }
    .score-bar-row { grid-template-columns: 72px 1fr 32px; }
    .cover-meta { gap: 20px; }
    .cover-meta-value { font-size: 17px; }
    .result-image { max-width: 240px; }
  }
</style>
</head>
<body>

<!-- ══════════ COVER ══════════ -->
<div id="cover">
  <!-- PIXEL ART DECORATIONS -->
  <div class="cover-deco">
    <div class="cover-grid"></div>
    <div class="cover-moon"></div>
    <!-- Stars -->
    <div class="cover-star" style="top:8%;left:10%;--dur:2.5s;--delay:0s;--float-dur:4s"></div>
    <div class="cover-star" style="top:15%;left:25%;--dur:3s;--delay:1s;--float-dur:5s"></div>
    <div class="cover-star" style="top:6%;left:45%;--dur:2s;--delay:0.5s;--float-dur:4.5s"></div>
    <div class="cover-star" style="top:20%;left:65%;--dur:3.5s;--delay:2s;--float-dur:6s"></div>
    <div class="cover-star" style="top:12%;left:80%;--dur:2.8s;--delay:0.8s;--float-dur:3.5s"></div>
    <div class="cover-star" style="top:25%;left:35%;--dur:3.2s;--delay:1.5s;--float-dur:5.5s"></div>
    <div class="cover-star" style="top:5%;left:55%;--dur:2.2s;--delay:0.3s;--float-dur:4.2s"></div>
    <div class="cover-star" style="top:18%;left:90%;--dur:2.7s;--delay:1.8s;--float-dur:3.8s"></div>
    
    <!-- Skyline Buildings -->
    <div class="cover-skyline">

// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
let answers = {};
let isTerminated = false;
let currentQIdx = 0;
let allFlat = [];

// Behavior tracking
let behaviorEvents = [];
let questionChangeCount = {};
let questionFirstSeen = {};
let backtracks = 0;
let surveyStartTime = 0;

function trackEvent(qid, eventType) {
  behaviorEvents.push({ qid, event: eventType, ts: Date.now() });
}
function trackChange(qid) {
  questionChangeCount[qid] = (questionChangeCount[qid] || 0) + 1;
  trackEvent(qid, 'change');
}

function buildFlatList() {
  allFlat = [];
  pages.forEach((page, pi) => {
    page.questions.forEach((q, qi) => {
      allFlat.push({ pageIdx: pi, qi, q });
    });
  });
}

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function getGlobalQuestionNumber(pageIdx, qi) {
  let count = 0;
  for (let i = 0; i < pageIdx; i++) {
    pages[i].questions.forEach(q => {
      if (!q.isCheck && q.type !== 'rating') count++;
      if (q.type === 'rating') count++;
      if (q.isCheck) count++;
    });
  }
  for (let j = 0; j <= qi; j++) {
    const q = pages[pageIdx].questions[j];
    if (q) count++;
  }
  return count;
}

// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
function startSurvey() {
  buildFlatList();
  currentQIdx = 0;
  behaviorEvents = [];
  questionChangeCount = {};
  questionFirstSeen = {};
  backtracks = 0;
  surveyStartTime = Date.now();
  document.getElementById('cover').style.display = 'none';
  document.getElementById('survey').style.display = 'block';
  renderCurrentQuestion();
}

function renderCurrentQuestion() {
  const entry = allFlat[currentQIdx];
  if (!entry) { computeAndShowResult(); return; }

  const { pageIdx, qi, q } = entry;
  
  // Track first view
  if (!questionFirstSeen[q.id]) {
    questionFirstSeen[q.id] = Date.now();
    trackEvent(q.id, 'view');
  }
  trackEvent(q.id, 'visit');

  const page = pages[pageIdx];
  const container = document.getElementById('questions-container');
  container.innerHTML = '';

  const phaseDiv = document.createElement('div');
  phaseDiv.className = 'phase-header';
  phaseDiv.innerHTML = `<div class="phase-label">${page.phase}</div><div class="phase-title">${page.phaseTitle}</div>`;
  container.appendChild(phaseDiv);

  const block = document.createElement('div');
  block.className = 'question-block';

  const qNumGlobal = getGlobalQuestionNumber(pageIdx, qi);

  let inner = `<div class="question-num">Q${qNumGlobal}</div><div class="question-text">${q.text}</div>`;
  if (q.hint) inner += `<div class="question-hint">${q.hint}</div>`;

  if (q.type === 'single') {
    inner += `<div class="options-list">`;
    q.options.forEach(opt => {
      const sel = answers[q.id] === opt.key ? ' selected' : '';
      inner += `<div class="option-item${sel}" onclick="selectSingle('${q.id}','${opt.key}',this,${q.isCheck||false},${!!opt.terminal})">
        <div class="option-key">${opt.key}</div>
        <div class="option-text">${opt.text}</div>
      </div>`;
    });
    inner += `</div>`;
  } else if (q.type === 'multi') {
    inner += `<div class="options-list">`;
    q.options.forEach(opt => {
      const sel = (answers[q.id] || []).includes(opt.key) ? ' selected' : '';
      inner += `<div class="option-item${sel}" onclick="selectMulti('${q.id}','${opt.key}',this)">
        <div class="option-key">${opt.key}</div>
        <div class="option-text">${opt.text}</div>
      </div>`;
    });
    inner += `</div>`;
  } else if (q.type === 'rating') {
    inner += `<table class="rating-table">
      <thead><tr><th>说法内容</th>`;
    for (let i = 1; i <= 5; i++) inner += `<th>${i}分</th>`;
    inner += `</tr></thead><tbody>`;
    q.statements.forEach(s => {
      inner += `<tr><td class="statement-cell">${s.text}</td>`;
      for (let i = 1; i <= 5; i++) {
        const checked = answers[s.id] == i ? ' checked' : '';
        inner += `<td class="rating-cell">
          <input type="radio" class="rating-radio" name="${s.id}" value="${i}"${checked}
            onchange="selectRating('${s.id}',${i})">
        </td>`;
      }
      inner += `</tr>`;
    });
    inner += `</tbody></table>`;
  } else if (q.type === 'open') {
    inner += `<textarea class="open-textarea" placeholder="想说啥就说啥……" 
      onchange="selectOpen('${q.id}',this.value)">${answers[q.id] || ''}</textarea>`;
  }

  block.innerHTML = inner;
  container.appendChild(block);

  const totalQ = allFlat.length;
  document.getElementById('progress-text').textContent = `${currentQIdx + 1} / ${totalQ}`;
  document.getElementById('progress-fill').style.width = `${((currentQIdx + 1) / totalQ) * 100}%`;
  document.getElementById('phase-label').textContent = page.phase;

  document.getElementById('btn-prev').disabled = currentQIdx === 0;

  const btnNext = document.getElementById('btn-next');
  if (q.type === 'multi' || q.type === 'rating' || q.type === 'open') {
    btnNext.style.display = '';
    btnNext.textContent = (currentQIdx >= totalQ - 1) ? '查看结果' : '下一题';
  } else {
    btnNext.style.display = 'none';
  }

  requestAnimationFrame(() => {
    document.getElementById('survey').scrollIntoView({ behavior: 'instant', block: 'start' });
  });
}

// ═══════════════════════════════════════
// SELECTION HANDLERS
// ═══════════════════════════════════════
function selectSingle(qid, key, el, isCheck, isTerminal) {
  const hadAnswer = !!answers[qid];
  answers[qid] = key;
  updateSelection(el);
  if (hadAnswer) trackChange(qid);

  if (isTerminal) {
    isTerminated = true;
    setTimeout(() => computeAndShowResult(), 400);
    return;
  }

  setTimeout(() => advanceQuestion(), 300);
}

function selectMulti(qid, key, el) {
  const hadAnswer = !!(answers[qid] && answers[qid].length);
  let arr = answers[qid] || [];
  if (arr.includes(key)) arr = arr.filter(k => k !== key);
  else arr.push(key);
  answers[qid] = arr;
  el.classList.toggle('selected');
  trackChange(qid);
}

function selectRating(sid, val) {
  const hadAnswer = !!answers[sid];
  answers[sid] = val;
  if (hadAnswer && answers[sid] !== val) trackChange(sid);
  else if (!hadAnswer) trackEvent(sid, 'change');
}

function selectOpen(qid, val) {
  const hadAnswer = !!answers[qid];
  answers[qid] = val;
  if (!hadAnswer && val) trackChange(qid);
}

function updateSelection(el) {
  const parent = el.parentElement;
  parent.querySelectorAll('.option-item').forEach(item => item.classList.remove('selected'));
  el.classList.add('selected');
}

function advanceQuestion() {
  if (currentQIdx < allFlat.length - 1) {
    currentQIdx++;
    renderCurrentQuestion();
  } else {
    computeAndShowResult();
  }
}

// ═══════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════
function nextQuestion() {
  advanceQuestion();
}

function prevQuestion() {
  if (currentQIdx > 0) {
    backtracks++;
    trackEvent(allFlat[currentQIdx].q.id, 'back');
    currentQIdx--;
    renderCurrentQuestion();
  }
}

// ═══════════════════════════════════════
// SCORING ENGINE (7 types)
// ═══════════════════════════════════════
function computeAndShowResult() {
  const scores = { looker: 0, laoma: 0, hughost: 0, oenbye: 0, wifier: 0, bystander: 0, apiao: 0 };

  pages.forEach(page => {
    page.questions.forEach(q => {
      if (q.type === 'single') {
        const key = answers[q.id];
        if (key) {
          const opt = q.options.find(o => o.key === key);
          if (opt && opt.scores) addScores(scores, opt.scores);
        }
      } else if (q.type === 'multi') {
        const keys = answers[q.id] || [];
        keys.forEach(key => {
          const opt = q.options.find(o => o.key === key);
          if (opt && opt.scores) addScores(scores, opt.scores);
        });
      } else if (q.type === 'rating') {
        q.statements.forEach(s => {
          const val = parseInt(answers[s.id]) || 0;
          if (val >= 1 && s.dims) {
            // 1→-1, 2→0, 3→+1, 4→+2, 5→+3
            const mapped = [0, -1, 0, 1, 2, 3][val];
            if (mapped > 0) {
              s.dims.forEach(dim => { scores[dim] = (scores[dim] || 0) + mapped; });
            }
          }
        });
      }
    });
  });

  // Boost for low participation
  if (isTerminated) {
    scores.oenbye += 1;
    scores.apiao += 1;
  }

  // Find winner
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
  let winner = sorted[0][0];

  // If top score is 0, assign apiao as default
  if (sorted[0][1] === 0) winner = 'apiao';

  showResult(winner, scores);
  submitToBackend(answers, winner, scores);
}

function addScores(target, src) {
  Object.entries(src).forEach(([k, v]) => { target[k] = (target[k] || 0) + v; });
}

// ═══════════════════════════════════════
// RESULT DISPLAY
// ═══════════════════════════════════════
function showResult(winner, scores) {
  document.getElementById('survey').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  window.scrollTo(0, 0);

  const p = personalities[winner];
  const color = p.color;

  document.getElementById('result-badge').textContent = p.badge;
  document.getElementById('result-badge').style.cssText = `background: ${color}22; color: ${color}; border: 1px solid ${color}44;`;

  document.getElementById('result-title').textContent = p.name;
  document.getElementById('result-title').style.color = color;

  document.getElementById('result-subtitle').textContent = p.en;

  document.getElementById('result-image').src = p.image;
  document.getElementById('result-image').style.borderColor = color;

  document.getElementById('result-verdict').textContent = p.verdict;
  document.getElementById('result-verdict').style.borderColor = color;

  // Score bars
  const allNames = { looker: '在地守望者', laoma: '社区营造者', hughost: '氛围栖居者', oenbye: '主动隔绝者', wifier: '赛博游牧者', bystander: '清醒隔绝者', apiao: '无感漂流者' };
  const allColors = { looker: 'var(--looker)', laoma: 'var(--laoma)', hughost: 'var(--hughost)', oenbye: 'var(--oenbye)', wifier: 'var(--wifier)', bystander: 'var(--bystander)', apiao: 'var(--apiao)' };

  const total = Math.max(Object.values(scores).reduce((a, b) => a + b, 0), 1);
  const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);

  const barsEl = document.getElementById('score-bars');
  barsEl.innerHTML = sorted.map(([k, v]) => {
    const pct = Math.round((v / total) * 100);
    return `<div class="score-bar-row">
      <div class="score-bar-label" style="color:${allColors[k]}">${allNames[k]}</div>
      <div class="score-bar-track">
        <div class="score-bar-fill" style="background:${allColors[k]};width:0%" data-pct="${pct}"></div>
      </div>
      <div class="score-bar-pct">${pct}%</div>
    </div>`;
  }).join('');

  setTimeout(() => {
    barsEl.querySelectorAll('.score-bar-fill').forEach(bar => {
      bar.style.width = bar.dataset.pct + '%';
    });
  }, 300);

  window._resultData = { winner, p, scores };
}

// ═══════════════════════════════════════
// SHARING
// ═══════════════════════════════════════
function copyLink() {
  navigator.clipboard.writeText(window.location.href).then(() => showToast('链接已复制'));
}

function copyResult() {
  const { winner, p } = window._resultData || { winner: 'looker', p: personalities.looker };
  const text = `「附近生物图鉴」\n我是：${p.name} ${p.en}\n${p.badge}\n\n${p.verdict.substring(0, 60)}……\n\n测测你是哪种附近生物：${window.location.href}`;
  navigator.clipboard.writeText(text).then(() => showToast('结果文字已复制'));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function restart() {
  answers = {};
  currentQIdx = 0;
  isTerminated = false;
  behaviorEvents = [];
  questionChangeCount = {};
  questionFirstSeen = {};
  backtracks = 0;
  document.getElementById('result').style.display = 'none';
  document.getElementById('cover').style.display = 'flex';
  window.scrollTo(0, 0);
}
